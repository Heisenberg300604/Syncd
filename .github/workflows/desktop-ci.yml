name: Desktop CI

on:
  push:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - '.github/workflows/desktop-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'Desktop/**'
      - '.github/workflows/desktop-ci.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Desktop Frontend (Types & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

  desktop-ci:
    name: Desktop CI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: Desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            bundle_args: '--bundles nsis'
          - platform: linux
            os: ubuntu-22.04
            bundle_args: '--bundles deb,appimage'
          - platform: macos
            os: macos-latest
            bundle_args: '--bundles dmg'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Desktop/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: Desktop/src-tauri

      - name: Check Rust formatting
        working-directory: Desktop/src-tauri
        run: cargo fmt --all --check

      - name: Clippy lints
        working-directory: Desktop/src-tauri
        run: cargo clippy -- -D warnings

      - name: Run unit & integration tests
        working-directory: Desktop/src-tauri
        run: cargo test

      - name: Build Desktop application bundle
        run: npm run tauri build -- ${{ matrix.bundle_args }} --config '{"bundle":{"createUpdaterArtifacts":false}}'
        env:
          CI: true

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: syncdesk-${{ matrix.platform }}
          path: |
            Desktop/src-tauri/target/release/bundle/nsis/*.exe
            Desktop/src-tauri/target/release/bundle/deb/*.deb
            Desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            Desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn


