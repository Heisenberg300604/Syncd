[package]
name = "syncd-desktop"
version = "1.0.0"
description = "SyncD Desktop Native Music Player and Social Listening Platform"
authors = ["SyncD Team"]
license = "MIT"
edition = "2021"

[lib]
name = "syncd_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
parking_lot = "0.12"
lofty = "0.21"
walkdir = "2.5"
rayon = "1.10"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cpal = "0.15"
symphonia = { version = "0.5", features = ["all"] }
rtrb = "0.3"

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

